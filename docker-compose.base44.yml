# Base44 development environment for the LUNORA storefront.
# Everything runs from the cloned source with live reload (no prebuilt app images).
services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: lunora
      POSTGRES_PASSWORD: lunora_dev_password
      POSTGRES_DB: lunora
    volumes:
      - lunora_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunora -d lunora"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: node:22
    working_dir: /app
    restart: "no"
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund --prefer-offline && exec node src/setup.js
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      DATABASE_URL: postgres://lunora:lunora_dev_password@db:5432/lunora
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true

  api:
    image: node:22
    working_dir: /app
    restart: on-failure
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund --prefer-offline && exec node --watch src/index.js
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      NODE_ENV: development
      PORT: "8000"
      DATABASE_URL: postgres://lunora:lunora_dev_password@db:5432/lunora
      COOKIE_SECURE: "false"
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/api/health').then(r=>{if(!r.ok)process.exit(1);return r.json()}).then(j=>{if(j.ok!==true)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund --prefer-offline && exec npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://api:8000
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX:-}
      BASE44_SANDBOX_HOST_DOMAIN: ${BASE44_SANDBOX_HOST_DOMAIN:-}
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

volumes:
  lunora_db:
  server_node_modules:
  client_node_modules:
